plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.teliy.seashell'
    compileSdk 34

    defaultConfig {
        applicationId "com.teliy.seashell"
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName "1.3.0"
    }

    signingConfigs {
        release {
            storeFile file("seashell.keystore")
            storePassword "seashell"
            keyAlias "seashell"
            keyPassword "seashell"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/AL2.0', 'META-INF/LGPL2.1',
                         'META-INF/versions/9/OSGI-INF/MANIFEST.MF', 'META-INF/versions/**/OSGI-INF/**',
                         'OSGI-INF/**', 'META-INF/versions/9/module-info.class']
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'com.github.mwiede:jsch:0.2.17'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'
}
